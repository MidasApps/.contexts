steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_DATAVIZ_DATABASE_ID=${_DATAVIZ_DATABASE_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_ADMIN_EMAIL_DOMAIN=${_NEXT_PUBLIC_ADMIN_EMAIL_DOMAIN}'
      - '-t'
      - '${_IMAGE}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image=${_IMAGE}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--cpu=1'
      - '--memory=512Mi'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--timeout=300s'
      - '--set-env-vars=NODE_ENV=production,NEXT_TELEMETRY_DISABLED=1,DATAVIZ_DATABASE_ID=${_DATAVIZ_DATABASE_ID}'
      - '--update-secrets=BIGQUERY_PROJECT_ID=BIGQUERY_PROJECT_ID:latest,BIGQUERY_LOCATION=BIGQUERY_LOCATION:latest,BIGQUERY_DATASET=BIGQUERY_DATASET:latest,ADMIN_EMAIL_DOMAIN=ADMIN_EMAIL_DOMAIN:latest,GOOGLE_CLOUD_PROJECT=GOOGLE_CLOUD_PROJECT:latest,GOOGLE_CLOUD_LOCATION=GOOGLE_CLOUD_LOCATION:latest,GOOGLE_VERTEX_PROJECT=GOOGLE_VERTEX_PROJECT:latest,GOOGLE_VERTEX_LOCATION=GOOGLE_VERTEX_LOCATION:latest,FIRECRAWL_API_KEY=FIRECRAWL_API_KEY:latest'

images:
  - '${_IMAGE}'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'

substitutions:
  _SERVICE: 'dataviz'
  _REGION: 'us-central1'
  _IMAGE: 'us-central1-docker.pkg.dev/$PROJECT_ID/dataviz/dataviz:latest'
  _NEXT_PUBLIC_FIREBASE_API_KEY: ''
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ''
  _NEXT_PUBLIC_FIREBASE_PROJECT_ID: ''
  _NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ''
  _NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ''
  _NEXT_PUBLIC_FIREBASE_APP_ID: ''
  # Banco Firestore do app. Uma substituição só alimenta o build-arg do bundle
  # (NEXT_PUBLIC_DATAVIZ_DATABASE_ID) e o env de runtime (DATAVIZ_DATABASE_ID):
  # servidor e navegador não podem apontar para bancos diferentes. Staging
  # sobrescreve com --substitutions=_DATAVIZ_DATABASE_ID=<banco>.
  _DATAVIZ_DATABASE_ID: 'dataviz'
  _NEXT_PUBLIC_ADMIN_EMAIL_DOMAIN: ''
