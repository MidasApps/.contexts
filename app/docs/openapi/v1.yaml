            nodeTimeZone: America/Manaus
          tenantId: Jd8sK2lPq0WnR5tYu3bV
      properties:
        organization:
          additionalProperties: false
          description: The organization.
          properties:
            createdAt:
              description: When the organization was created (UTC).
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
              x-pii: none
            defaults:
              additionalProperties: false
              description: "Regional defaults: locale, time zone and currency."
              properties:
                currency:
                  description: Default ISO 4217 currency for new amounts.
                  pattern: ^[A-Z]{3}$
                  type: string
                  x-pii: none
                locale:
                  description: Default BCP 47 locale when the user has no preference.
                  minLength: 1
                  type: string
