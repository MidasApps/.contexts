            createdAt: "2026-09-29T14:30:00.000Z"
            description: Rollout of the new catalog.
            id: Pq4rS6tU8vW0xY2zA1bC
            name: Launch
            settings:
              timeZone: America/Manaus
            status: active
            tenantId: Jd8sK2lPq0WnR5tYu3bV
