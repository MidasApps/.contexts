            x-pii: none
        - description: Page size, 1-100 (default 20).
          in: query
          name: limit
          required: false
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
            x-pii: none
        - description: Organization whose connectors to list; required (400 without it).
          in: query
          name: organizationId
          required: false
          schema:
            minLength: 1
            type: string
            x-pii: none
      responses:
        "200":
          content:
