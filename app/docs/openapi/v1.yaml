                          minLength: 1
                          type: string
                          x-pii: none
                        parts:
                          description: Message parts.
                          items:
                            additionalProperties: {}
                            description: A message part.
                            properties:
                              type:
                                description: Part type.
                                minLength: 1
                                type: string
                                x-pii: none
                            required:
                              - type
                            type: object
                            x-pii: personal
                          type: array
                          x-pii: personal
                        role:
                          description: Author role.
                          enum:
                            - user
                            - assistant
                            - system
                          type: string
                          x-pii: none
                      required:
                        - id
                        - role
                        - parts
                      type: object
                      x-pii: personal
                    type: array
                    x-pii: personal
                  meta:
                    additionalProperties: false
                    description: Response metadata.
                    properties:
                      page:
                        additionalProperties: false
                        description: Pagination state.
                        properties:
                          cursor:
                            anyOf:
                              - minLength: 1
                                type: string
                              - type: "null"
                            description: Opaque cursor of the next page; null at the end.
                            x-pii: none
                          hasMore:
                            description: Whether another page exists.
                            type: boolean
                            x-pii: none
                          limit:
                            description: Page size used for this response.
                            maximum: 100
                            minimum: 1
                            type: integer
                            x-pii: none
                        required:
                          - cursor
                          - hasMore
                          - limit
                        type: object
                        x-pii: none
                    required:
                      - page
                    type: object
                    x-pii: none
                required:
                  - data
                  - meta
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/http.ErrorEnvelope"
          description: VALIDATION_FAILED
          x-error-codes:
            - VALIDATION_FAILED
