      examples:
        - organization:
            createdAt: "2026-09-29T14:30:00.000Z"
            defaults:
              currency: BRL
              locale: pt-BR
              timeZone: America/Sao_Paulo
            id: Jd8sK2lPq0WnR5tYu3bV
            name: Northwind
            status: active
            tenantId: Jd8sK2lPq0WnR5tYu3bV
            updatedAt: "2026-09-29T15:00:00.000Z"
          permissions:
            - core.organization.read
            - core.project.read
            - core.unit.read
