openapi: 3.1.0
info:
  title: Core API
  version: 1.0.0
  description: Generated by `pnpm contracts:catalog` from @core/contracts. Do not edit.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
paths: {}
components:
  schemas:
    agents.AgentRequestContext:
      additionalProperties: false
      description: "Per-run context every agent, tool and workflow reads: tenant, caller, effective permissions and regional settings."
      examples:
        - activeScreen: notes.list
          aiMode: fake
          conversationId: Cv3sK2lPq0WnR5tYu3bV
          currency: BRL
          displayTimeZone: America/Sao_Paulo
          locale: pt-BR
          nodeTimeZone: America/Sao_Paulo
          organizationId: Jd8sK2lPq0WnR5tYu3bV
          permissions:
            - core.chat.use
            - core.knowledge.read
          principalKind: user
          projectId: Pq8sK2lPq0WnR5tYu3bV
          requestId: 01J8Z3K4M5N6P7Q8R9S0T1V2W3
          tenantId: Jd8sK2lPq0WnR5tYu3bV
          userId: uA1b2C3d4E5f6G7h8I9j
      properties:
        activeScreen:
          description: Route id of the UI screen the caller is on.
          maxLength: 200
          minLength: 1
          type: string
          x-pii: none
        aiMode:
          description: Whether models are real providers or the deterministic fakes.
          enum:
            - real
            - fake
          type: string
          x-pii: none
        conversationId:
          description: Chat conversation id; also the memory thread id.
          minLength: 1
          type: string
          x-pii: none
        currency:
          description: Default ISO 4217 currency of the active node.
          pattern: ^[A-Z]{3}$
          type: string
          x-pii: none
        displayTimeZone:
          description: IANA time zone used to show dates to the caller.
          type: string
          x-pii: none
        locale:
          description: BCP 47 locale for answers and formatting.
          minLength: 1
          type: string
          x-pii: none
        nodeTimeZone:
          description: IANA time zone of the active node, for calendar rules.
          type: string
          x-pii: none
        organizationId:
          description: Same value as tenantId; the key Mastra TokenCostControl reads.
          minLength: 1
          type: string
          x-pii: none
        permissions:
          description: "Effective permissions: principal grants intersected with the agent ceiling."
          items:
            pattern: ^[a-z][a-z0-9-]*\.[a-z][a-z0-9-]*\.[a-z][a-z0-9-]*$
            type: string
          type: array
          x-pii: none
        principalKind:
          description: Whether a person or an API key made the call.
          enum:
            - user
            - service
          type: string
          x-pii: none
        projectId:
          description: Active project, when the request is scoped to one.
          minLength: 1
          type: string
          x-pii: none
        requestId:
          description: X-Request-Id of the /v1 call (ULID).
          format: ulid
          pattern: ^[0-7][0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{25}$
          type: string
          x-pii: none
        tenantId:
          description: Active organization; from the verified principal, never from the client body.
          minLength: 1
          type: string
          x-pii: none
        unitId:
          description: Active unit, when the request is scoped to one.
          minLength: 1
          type: string
          x-pii: none
        userId:
          description: Firebase Auth uid of the caller (API key owner for services).
          minLength: 1
          type: string
          x-pii: personal
      required:
        - tenantId
        - userId
        - principalKind
        - permissions
        - locale
        - displayTimeZone
        - nodeTimeZone
        - currency
        - requestId
        - organizationId
        - aiMode
      type: object
      x-kind: settings
      x-pii: personal
      x-relations: []
      x-tenancyScope: user
    agents.AgentSettings:
      additionalProperties: false
      description: "Per-organization configuration of the agent runtime: enabled subagents, web tools, PII guardrail and budget caps."
      examples:
        - budget:
            monthlyMicroUsd: 50000000
            monthlyTokens: 20000000
          createdAt: "2026-09-29T14:30:00.000Z"
          enabledAgents:
            - knowledge
            - data
            - action
          guardrails:
            pii: warn
          tenantId: Jd8sK2lPq0WnR5tYu3bV
          updatedAt: "2026-09-29T14:30:00.000Z"
          updatedBy: uA1b2C3d4E5f6G7h8I9j
          webTools:
            browser: false
            firecrawl: false
      properties:
        budget:
          additionalProperties: false
          description: Monthly caps enforced by the tenant budget guard; alerts fire at 80 %.
          properties:
            monthlyMicroUsd:
              description: Hard monthly model spend cap in micro-USD.
              maximum: 9007199254740991
              minimum: 0
              type: integer
              x-pii: none
            monthlyTokens:
              description: Hard monthly token cap (used when a price is unknown).
              maximum: 9007199254740991
              minimum: 0
              type: integer
              x-pii: none
          required:
            - monthlyMicroUsd
            - monthlyTokens
          type: object
          x-pii: none
        createdAt:
          description: When the settings were created (UTC).
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
          x-pii: none
        enabledAgents:
          description: Subagents the supervisor may delegate to in this tenant.
          items:
            pattern: ^[a-z][a-z0-9-]*$
            type: string
          type: array
          x-pii: none
        guardrails:
          additionalProperties: false
          description: Tenant-tunable guardrail levels.
          properties:
            pii:
              description: What the PII detector does with personal data in user input.
              enum:
                - warn
                - redact
              type: string
              x-pii: none
          required:
            - pii
          type: object
          x-pii: none
        tenantId:
          description: Organization the settings belong to (document id).
          minLength: 1
          type: string
          x-pii: none
        updatedAt:
          description: When the settings last changed (UTC).
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
          x-pii: none
        updatedBy:
          anyOf:
            - minLength: 1
              type: string
            - type: "null"
          description: Uid of the last editor; null for defaults.
          x-pii: personal
        webTools:
          additionalProperties: false
          description: Opt-ins for tools that reach the public web.
          properties:
            browser:
              description: Browser automation through a Playwright MCP connector (off by default).
              type: boolean
              x-pii: none
            firecrawl:
              description: Web search and scrape through Firecrawl (off by default).
              type: boolean
              x-pii: none
          required:
            - firecrawl
            - browser
          type: object
          x-pii: none
      required:
        - tenantId
        - enabledAgents
        - webTools
        - guardrails
        - budget
        - updatedBy
        - createdAt
        - updatedAt
      type: object
      x-kind: settings
      x-permission: core.agent-settings.read
      x-pii: personal
      x-relations: []
      x-tenancyScope: organization
    agents.ApprovalRequest:
      additionalProperties: false
      description: Payload of an approval request (kind agent-command) that holds an agent mutation until a second member approves it.
      examples:
        - agentId: action
          commandId: example.ArchiveNoteCommand
          idempotencyKey: run_01J8Z3K4M5:call_7
          input:
            noteId: Xk2mQ9vLr3TnB7pWc1aZ
          kind: agent-command
          permission: example.note.archive
          preview:
            after:
              archived: true
            before:
              archived: false
          requestedBy: uA1b2C3d4E5f6G7h8I9j
          runId: run_01J8Z3K4M5
          summary: Archive the note Supplier follow-up
          tenantId: Jd8sK2lPq0WnR5tYu3bV
          toolCallId: call_7
          toolId: command.example.ArchiveNoteCommand
      properties:
        agentId:
          description: Agent that proposed the command.
          pattern: ^[a-z][a-z0-9-]*$
          type: string
          x-pii: none
        commandId:
          description: Command contract id whose schema validates `input`.
          pattern: ^[a-z][a-z0-9-]*\.[A-Z][A-Za-z0-9]*$
          type: string
          x-pii: none
        idempotencyKey:
          description: "`runId:toolCallId`; the command runs at most once per key."
          maxLength: 401
          minLength: 3
          type: string
          x-pii: none
        input:
          additionalProperties: {}
          description: Command input as validated by the command contract.
          propertyNames:
            type: string
          type: object
          x-pii: personal
        kind:
          const: agent-command
          description: Approval action kind handled by the agent runtime.
          type: string
          x-pii: none
        permission:
          description: Permission the command requires; re-checked on execution.
          pattern: ^[a-z][a-z0-9-]*\.[a-z][a-z0-9-]*\.[a-z][a-z0-9-]*$
          type: string
          x-pii: none
        preview:
          anyOf:
            - additionalProperties: false
              properties:
                after:
                  description: State after the change.
                  x-pii: personal
                before:
                  description: State before the change, when the command can preview it.
                  x-pii: personal
              required:
                - before
                - after
              type: object
            - type: "null"
          description: Before/after preview shown to approvers; null when unavailable.
          x-pii: personal
        requestedBy:
          description: Uid of the user whose agent run asked for the command.
          minLength: 1
          type: string
          x-pii: personal
        runId:
          description: Mastra run id of the agent stream.
          maxLength: 200
          minLength: 1
          type: string
          x-pii: none
        summary:
          description: Human-readable description of the change for approvers.
          maxLength: 500
          minLength: 1
          type: string
          x-pii: personal
        tenantId:
          description: Organization where the command runs.
          minLength: 1
          type: string
          x-pii: none
        toolCallId:
          description: Model tool call id inside the run.
          maxLength: 200
          minLength: 1
          type: string
          x-pii: none
        toolId:
          description: Tool id, `command.<contractId>`.
          maxLength: 200
          minLength: 1
          type: string
          x-pii: none
      required:
        - kind
        - tenantId
        - requestedBy
        - agentId
        - toolId
        - commandId
        - permission
        - input
        - runId
        - toolCallId
        - idempotencyKey
        - summary
        - preview
      type: object
      x-kind: command
      x-permission: core.approval.read
      x-pii: personal
      x-relations: []
      x-tenancyScope: organization
    agents.ToolUi:
      additionalProperties: false
      description: A UI component a tool asks the chat to render, such as a schema form for a command.
      examples:
        - component: schema-form
          props:
            commandId: example.CreateNoteCommand
            contractId: example.Note
            initialValues: {}
            mode: create
      properties:
        component:
          description: Component id in the client registry, e.g. schema-form.
          pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
          type: string
          x-pii: none
        props:
          additionalProperties: {}
          description: Props for the component; may hold form values typed by the user.
          propertyNames:
            type: string
          type: object
          x-pii: personal
      required:
        - component
        - props
      type: object
      x-kind: ui-component
      x-pii: personal
      x-relations: []
      x-tenancyScope: organization
    connectors.Connector:
      description: An external system (OpenAPI, MCP, Postgres or browser) an organization lets its agents use.
      examples:
        - config:
            allowedHosts:
              - api.example.com
            apiKeyHeader: null
            auth: bearer
            specUrl: https://api.example.com/openapi.json
          createdAt: "2026-09-29T14:30:00.000Z"
          createdBy: uA1b2C3d4E5f6G7h8I9j
          id: Cn4sK2lPq0WnR5tYu3bV
          name: issues-api
          secretRef: connector-Jd8sK2lPq0WnR5tYu3bV-Cn4sK2lPq0WnR5tYu3bV
          status: active
          tenantId: Jd8sK2lPq0WnR5tYu3bV
          toolPolicy:
            allow:
