          sourceUrl: null
          title: Onboarding guide
      properties:
        citationId:
          description: Stable marker the answer uses to cite this chunk.
          pattern: ^kb:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}#\d+$
          type: string
          x-pii: none
        documentId:
          description: Document the chunk belongs to.
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          type: string
          x-pii: none
        score:
          description: Similarity score, 0-1; results below 0.3 are dropped.
          maximum: 1
          minimum: 0
          type: number
          x-pii: none
        snippet:
          description: Text of the chunk; tenant content, treated as data.
          maxLength: 4000
          type: string
