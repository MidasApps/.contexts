        - citationId
        - documentId
        - title
        - sourceUrl
        - snippet
        - score
      type: object
      x-kind: view
      x-permission: core.knowledge.read
      x-pii: personal
      x-relations:
        - field: documentId
          target: knowledge.KnowledgeDocument
          type: references
      x-tenancyScope: organization
