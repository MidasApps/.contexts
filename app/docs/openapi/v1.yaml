          in: query
          name: level
          required: false
          schema:
            enum:
              - debug
              - info
              - warn
              - error
            type: string
            x-pii: none
        - description: Text the message contains.
          in: query
          name: q
          required: false
          schema:
            maxLength: 200
            minLength: 1
            type: string
            x-pii: none
        - description: Only lines of this trace.
          in: query
          name: traceId
          required: false
          schema:
            maxLength: 128
            minLength: 1
            type: string
            x-pii: none
        - description: Only lines of this request.
          in: query
