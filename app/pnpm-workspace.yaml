  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.7
  "@types/eslint-plugin-jsx-a11y": 6.10.1 # the plugin ships no types; typechecks packages/config/eslint
  "@types/node": 26.6.3
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
