  "@opentelemetry/exporter-trace-otlp-proto": 0.218.0 # http/protobuf OTLP; @mastra/otel-exporter 1.4.2 peers ^0.218.0 (0.222.0 is outside it)
  "@playwright/test": 1.63.0 # e2e runner (web + desktop-web projects); no component testing (E5)
  "@next/eslint-plugin-next": 16.3.8
  "@tailwindcss/node": 4.3.3 # compiles globals.css in the client token test
  "@tailwindcss/postcss": 4.3.3 # web (Next) Tailwind plugin, postcss.config.mjs
  "@tailwindcss/vite": 4.3.3 # desktop (Vite) Tailwind plugin
