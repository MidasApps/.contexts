# apps/web runs on App Hosting nodejs24 (spec §14/§16.3): its Node types stay on 24.
catalogs:
  node24:
    "@types/node": 24.19.0

engineStrict: true
savePrefix: ""

# Build scripts stay off unless something here needs them:
# - unrs-resolver and esbuild (used by the mastra bundler) only fetch a native
#   binary when the optional platform package is missing, and pnpm already
#   installs it;
# - @firebase/util only bakes FIREBASE_WEBAPP_CONFIG defaults (unused);
# - protobufjs only checks its CLI's dependencies;
# - re2 is superstatic's optional native regex (Hosting emulator, unused here),
#   which falls back to RegExp.
# - @swc/core and @parcel/watcher come with next-intl for its optional message
#   extractor (unused: catalogs are hand-written JSON, decision 0013); their
#   scripts only check or build the native binary pnpm installs as an optional
#   platform package.
# - edgedriver and geckodriver (webdriverio, native desktop smoke) only pre-download a
#   driver at install; WebdriverIO and @wdio/tauri-service fetch the matching one on use.
allowBuilds:
  "@firebase/util": false
  "@parcel/watcher": false
  "@swc/core": false
  edgedriver: false
  esbuild: false
  geckodriver: false
  protobufjs: false
  re2: false
  unrs-resolver: false

# pnpm 12 holds back releases younger than minimumReleaseAge. Next 16.3.7 is the
# security release published on 2026-09-29 (spec §16.1), so its packages were
# admitted explicitly by pnpm; drop these entries once they age past the window.
# Remove the Next entries after 2026-10-07 (7 days after the 2026-09-29 publish):
# they are all Next 16.3.7 packages, so they go together.
minimumReleaseAgeExclude:
  - '@next/env@16.3.7'
  - '@next/eslint-plugin-next@16.3.7'
  - '@next/swc-darwin-arm64@16.3.7'
  - '@next/swc-darwin-x64@16.3.7'
  - '@next/swc-linux-arm64-gnu@16.3.7'
  - '@next/swc-linux-arm64-musl@16.3.7'
  - '@next/swc-linux-x64-gnu@16.3.7'
  - '@next/swc-linux-x64-musl@16.3.7'
  - '@next/swc-win32-arm64-msvc@16.3.7'
  - '@next/swc-win32-x64-msvc@16.3.7'
  - next@16.3.7
  # SP2 client (Task 3): latest releases published on 2026-09-29, admitted by pnpm at
  # install; remove these three after 2026-10-06 (7 days after the publish).
  - icu-minify@4.14.8 # dependency of use-intl
  - lucide-react@1.49.0
  - use-intl@4.14.8
  # SP2 web wiring (Task 18): next-intl and its SWC extractor, published 2026-09-29;
  # remove after 2026-10-06 (7 days after the publish).
  - next-intl@4.14.8
  - next-intl-swc-plugin-extractor@4.14.8
  # SP3 model factory (Task 5): latest @ai-sdk/openai, published 2026-09-29, admitted by
  # pnpm at install; remove after 2026-10-06 (7 days after the publish).
  - '@ai-sdk/openai@4.0.81'
  # SP3 connectors (Task 22): @mastra/mcp 2.1.1, published 2026-09-29, admitted by pnpm at
  # install; remove after 2026-10-07 (7 days after the publish).
  - '@mastra/mcp@2.1.1'
  # SP3 web tools (Task 23): firecrawl 4.42.1, published 2026-09-30, admitted by pnpm at
  # install; remove after 2026-10-07 (7 days after the publish).
  - firecrawl@4.42.1
  # source-map-js 1.2.2 (security fix, published 2026-09-30; decision 0071, addendum):
  # remove after 2026-10-07 (7 days after the publish).
  - source-map-js@1.2.2

# firecrawl 4.42.1 (latest) pins axios 1.18.0, which has high advisories fixed in 1.20.0
# (GHSA-r4gj-5m52-g5wh and six more; found by the Mastra output audit, SP3 Task 25). Drop this
# override once firecrawl depends on axios >= 1.20.0.
overrides:
  "firecrawl>axios": 1.20.0
  # High advisories found by the first GitHub CI run (decision 0071). Drop each once its parent
  # depends on the patched version.
  "@firebase/firestore>@grpc/grpc-js": 1.14.5
  "get-uri>basic-ftp": 6.2.1
  "mocha>serialize-javascript": 7.0.3
  # GHSA-cjq9-62q9-8jv4 (high, Next.js image optimization SSRF, patched in 16.3.8): inngest takes
  # next as a peer and the lockfile kept 16.3.7 for it. Drop once the lockfile resolves it to the
  # catalog's next on its own.
  "inngest>next": 16.3.8
  # GHSA-68fv-2mgg-jv7q (2026-10-06): about 100 paths (postcss, css-tree, ...), so not scoped
  # to one parent. Drop once postcss and css-tree depend on >= 1.2.2.
  source-map-js: 1.2.2

# High advisories with no patched release, reachable only from dev and build tooling (decision 0071).
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv # extract-zip: desktop native test tooling (@wdio > @puppeteer/browsers)
    - GHSA-7pqw-9j4j-h8q3 # extract-zip: same path
    - GHSA-vfj7-8cjw-p6xm # braces: lint plugins, firebase-tools and the Mastra deployer (build time)
