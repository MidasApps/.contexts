packages:
  - apps/*
  - packages/*
  - modules/*
  # Workspace tooling: `pnpm dev` orchestration and `pnpm seed:local` (package @core/scripts).
  - scripts

# Exact pins so every package resolves the same version (ADR 0004: latest stable,
# measured with `npm view` on 2026-09-29; exceptions E2/E3 noted inline).
catalog:
  "@ai-sdk/anthropic": 4.0.68 # model factory (decision 0021)
  "@ai-sdk/google": 4.0.85 # Gemini via AI Studio key
  "@ai-sdk/google-vertex": 5.0.98 # Gemini via Vertex ADC (GOOGLE_AI_BACKEND=vertex)
  "@ai-sdk/openai": 4.0.81
  "@ai-sdk/provider": 4.0.19 # LanguageModelV4 types for the fake models
  "@eslint/js": 9.39.5
  "@firebase/rules-unit-testing": 5.0.2
  "@formatjs/icu-messageformat-parser": 3.5.20 # i18n:check parses ICU messages
  "@formatjs/intl-localematcher": 0.9.0 # locale negotiation (RFC 4647 best fit)
  "@mastra/core": 1.71.0
  "@mastra/deployer": 1.71.0 # createNodeServer for the agents auth emulator test (same train as core)
  "@mastra/loggers": 1.3.2
  "@mastra/observability": 1.18.1
  "@mastra/pg": 1.27.1
  "@next/eslint-plugin-next": 16.3.7
  "@tailwindcss/node": 4.3.3 # compiles globals.css in the client token test
  "@tanstack/react-query": 5.104.0
  "@tanstack/react-router": 1.170.40
  "@tanstack/router-plugin": 1.168.41 # file-based routes (Vite plugin)
  "@tauri-apps/api": 2.12.0 # same minor as the tauri crate (CLI checks it)
  "@tauri-apps/cli": 2.12.0
  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.7
  "@types/eslint-plugin-jsx-a11y": 6.10.1 # the plugin ships no types; typechecks packages/config/eslint
  "@types/node": 26.6.3
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@typescript/typescript6": 6.0.2
  "@vitejs/plugin-react": 6.1.1
  ai: 7.0.122
  axe-core: 4.13.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  drizzle-kit: 0.31.11 # generates SQL migrations into infra/postgres/migrations (decision 0023)
  drizzle-orm: 0.45.3
  eslint: 9.39.5 # E3: eslint-plugin-react only accepts ^9.7
  eslint-import-resolver-typescript: 4.4.5
  eslint-plugin-boundaries: 7.2.0
  esbuild: 0.28.2 # bundles apps/functions into a self-contained lib/
  eslint-plugin-jsx-a11y: 6.10.2
  eslint-plugin-react: 7.37.5 # E3: accepts ESLint ^9.7, not 10
  eslint-plugin-react-hooks: 7.1.1
  firebase: 12.19.0
  firebase-admin: 14.5.0
  firebase-functions: 7.4.0
  firebase-tools: 15.32.0
  jsdom: 30.1.1
  lucide-react: 1.49.0
  mastra: 1.31.3 # CLI; same release train as @mastra/core
  next: 16.3.7
  postgres: 3.4.9
  radix-ui: 1.6.7 # unified Radix package (shadcn new-york base)
  react: 19.3.0
  react-dom: 19.3.0
  server-only: 0.0.1
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  turbo: 2.11.5
  typescript: 7.0.2
  typescript-eslint: 8.71.0 # E2: runs on the TS 6 API via .pnpmfile.cjs
  ulid: 3.0.2
  use-intl: 4.14.8 # same release as next-intl (web wraps it)
  vite: 8.3.1
  vitest: 5.0.2
  yaml: 2.9.1
  zod: 4.6.5

# apps/web runs on App Hosting nodejs24 (spec §14/§16.3): its Node types stay on 24.
catalogs:
  node24:
    "@types/node": 24.19.0

engineStrict: true
savePrefix: ""

# Build scripts stay off unless something here needs them:
# - unrs-resolver and esbuild (used by the mastra bundler) only fetch a native
#   binary when the optional platform package is missing, and pnpm already
#   installs it;
# - @firebase/util only bakes FIREBASE_WEBAPP_CONFIG defaults (unused);
# - protobufjs only checks its CLI's dependencies;
# - re2 is superstatic's optional native regex (Hosting emulator, unused here),
#   which falls back to RegExp.
allowBuilds:
  "@firebase/util": false
  esbuild: false
  protobufjs: false
  re2: false
  unrs-resolver: false

# pnpm 12 holds back releases younger than minimumReleaseAge. Next 16.3.7 is the
# security release published on 2026-09-29 (spec §16.1), so its packages were
# admitted explicitly by pnpm; drop these entries once they age past the window.
# Remove the Next entries after 2026-10-07 (7 days after the 2026-09-29 publish):
# they are all Next 16.3.7 packages, so they go together.
minimumReleaseAgeExclude:
  - '@next/env@16.3.7'
  - '@next/eslint-plugin-next@16.3.7'
  - '@next/swc-darwin-arm64@16.3.7'
  - '@next/swc-darwin-x64@16.3.7'
  - '@next/swc-linux-arm64-gnu@16.3.7'
  - '@next/swc-linux-arm64-musl@16.3.7'
  - '@next/swc-linux-x64-gnu@16.3.7'
  - '@next/swc-linux-x64-musl@16.3.7'
  - '@next/swc-win32-arm64-msvc@16.3.7'
  - '@next/swc-win32-x64-msvc@16.3.7'
  - next@16.3.7
  # SP2 client (Task 3): latest releases published on 2026-09-29, admitted by pnpm at
  # install; remove these three after 2026-10-06 (7 days after the publish).
  - icu-minify@4.14.8 # dependency of use-intl
  - lucide-react@1.49.0
  - use-intl@4.14.8
  # SP3 model factory (Task 5): latest @ai-sdk/openai, published 2026-09-29, admitted by
  # pnpm at install; remove after 2026-10-06 (7 days after the publish).
  - '@ai-sdk/openai@4.0.81'
