  eslint-plugin-react-hooks: 7.1.1
  firebase: 12.19.0
  firebase-admin: 14.5.0
  firebase-functions: 7.4.0
  firebase-tools: 15.32.0
  file-type: 22.1.1 # magic-byte check of uploads in onObjectFinalized (files context)
  firecrawl: 4.42.1 # web search/scrape SDK (decision 0027, D3-16; MIT); brings its own zod 3, axios and zod-to-json-schema
