  "@mastra/core": 1.71.0
  "@mastra/deployer": 1.71.0 # createNodeServer for the agents auth emulator test (same train as core)
  "@mastra/google-cloud-pubsub": 1.1.3 # Mastra event bus on Google Cloud Pub/Sub outside local (Task 25; Apache-2.0); pulls @google-cloud/pubsub 5 and inngest
