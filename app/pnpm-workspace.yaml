  "@ai-sdk/openai": 4.0.81
  "@ai-sdk/provider": 4.0.19 # LanguageModelV4 types for the fake models
  "@ai-sdk/react": 4.0.125 # useChat for the chat panel; pins ai 7.0.122 exactly (4.0.129 needs ai 7.0.126: bump with the ai train, decision 0035)
  "@biomejs/biome": 2.5.15 # formatter only; ESLint keeps the rules (decision 0068)
  "@axe-core/playwright": 4.13.0 # axe in the e2e journeys (web, desktop-web)
  "@eslint/js": 9.39.5
  "@firebase/rules-unit-testing": 5.0.2
  "@formatjs/icu-messageformat-parser": 3.5.20 # i18n:check parses ICU messages
  "@formatjs/intl-localematcher": 0.9.0 # locale negotiation (RFC 4647 best fit)
  "@google-cloud/bigquery": 9.1.0 # usage sink to ai_observability.llm_calls (decision 0026)
  "@google-cloud/secret-manager": 7.1.1 # connector secrets outside local (decision 0027, Apache-2.0)
  "@apidevtools/swagger-parser": 13.1.0 # OpenAPI connectors: parse + dereference 3.0/3.1 (decision 0027, MIT)
  "openapi-types": 12.1.3 # peer of swagger-parser (types only, MIT)
  "@mastra/ai-sdk": 1.10.5 # handleChatStream v7 (AI SDK UI message stream) for the chat routes (decision 0031, Apache-2.0)
