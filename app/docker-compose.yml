# Local-only services (processes/environments.md §9). Firebase runs in the
# Emulator Suite (firebase.json); this file only holds Postgres + pgvector.
# Compose reads `.env` next to this file; to reuse .env.local run
# `docker compose --env-file .env.local up -d --wait`.
name: core

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      # Bound to loopback; set POSTGRES_PORT when 5432 is taken (and DATABASE_URL to match).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep PGDATA under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
      # Runs once, on an empty volume only; `docker compose down -v` to re-run.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP on purpose: the init-time server listens on the socket only, so the
      # check stays red until the init scripts have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
